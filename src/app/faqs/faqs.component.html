<div class="panel-header panel-header-lg" ></div>
   
<div class="main-content">
    <div class="row">
        <div class="col-lg-12">
          <div class="card card-chart" style="background-color: transparent;">
            <div class="card-header">
              <h1 class="card-title exemplarPro-family" style="text-transform: uppercase;">FAQs</h1>
            </div>
          </div>
        </div>
        <div class="col-lg-12">
            <div class="accordion">
                <div class="accordion-item" *ngFor="let faq of faqs; let i = index">
                    <div class="accordion-header" (click)="toggle(i)" [ngClass]="i === openIndex ? 'active' : ''">
                        <h5 class="mb-0">{{ faq.question }}</h5>
                        <span class="icon"></span>
                    </div>
                    <div class="accordion-body" [@slideToggle]="i === openIndex ? 'open' : 'closed'">
                        <p class="mb-0">{{ faq.answer }}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
